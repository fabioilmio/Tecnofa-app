<script>window.settings=function(){const u=window.tfCurrentUser?window.tfCurrentUser():null;const name=u?.name||'Utente';return `<div class="page-head"><div><div class="eyebrow">Sistema</div><h1>Impostazioni</h1><p>Controllo accesso, aggiornamento dell'applicazione e sessione corrente.</p></div></div><div class="tf-settings-grid"><section class="tf-settings-card"><h2>Sessione</h2><p>Account attualmente collegato al gestionale.</p><div class="detail-card"><span>Utente</span><strong>${esc(name)}</strong></div><div class="tf-settings-actions" style="margin-top:12px"><button class="tf-danger-btn" onclick="if(confirm('Vuoi uscire dal gestionale?'))tfLogout()">↪ Esci dal gestionale</button><button class="ghost-btn" onclick="tfChangePassword()">Cambia password</button></div></section><section class="tf-settings-card"><h2>Aggiornamento applicazione</h2><p>Usa questo comando quando è stata pubblicata una nuova versione o quando l'app mostra una versione precedente.</p><div class="tf-settings-actions"><button class="primary" id="tf-force-update" onclick="tfForceUpdate()">↻ Aggiorna e svuota cache</button></div><div id="tf-update-status" class="tf-update-status"></div><div class="tf-settings-version">TECNOFA Gestionale · cache PWA v25</div></section></div>`};window.tfForceUpdate=async function(){const status=document.getElementById('tf-update-status'),btn=document.getElementById('tf-force-update');if(btn)btn.disabled=true;if(status)status.textContent='Pulizia cache e aggiornamento in corso…';try{if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}if('caches' in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('tecnofa-')).map(k=>caches.delete(k)));}}catch(e){console.warn(e)}setTimeout(()=>{const u=new URL(location.href);u.searchParams.set('update',Date.now());location.replace(u.href)},250)};</script></body></html>
