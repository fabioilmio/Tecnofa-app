window.settings=function(){const u=window.tfCurrentUser?window.tfCurrentUser():null;const name=u?.name||'Utente';return `<div class="page-head"><div><div class="eyebrow">Sistema</div><h1>Impostazioni</h1><p>Controllo accesso, aggiornamento dell'applicazione, backup e sessione corrente.</p></div></div><div class="tf-settings-grid"><section class="tf-settings-card"><h2>Sessione</h2><p>Account attualmente collegato al gestionale.</p><div class="detail-card"><span>Utente</span><strong>${esc(name)}</strong></div><div class="tf-settings-actions" style="margin-top:12px"><button class="tf-danger-btn" onclick="if(confirm('Vuoi uscire dal gestionale?'))tfLogout()">↪ Esci dal gestionale</button><button class="ghost-btn" onclick="tfChangePassword()">Cambia password</button></div></section><section class="tf-settings-card"><h2>Aggiornamento applicazione</h2><p>Usa questo comando quando è stata pubblicata una nuova versione o quando l'app mostra una versione precedente.</p><div class="tf-settings-actions"><button class="primary" id="tf-force-update" onclick="tfForceUpdate()">↻ Aggiorna e svuota cache</button></div><div id="tf-update-status" class="tf-update-status"></div><div class="tf-settings-version">TECNOFA Gestionale · cache PWA v41</div></section><section class="tf-settings-card tf-backup-card"><h2>Backup dati</h2><p>Salva una copia locale di clienti, interventi, utenti, magazzino, archivi, impostazioni e dati del gestionale. La sessione corrente non viene esportata.</p><div class="tf-backup-actions"><button class="primary" onclick="tfExportBackup()">↓ Esporta backup</button><button class="ghost-btn" onclick="document.getElementById('tf-backup-file').click()">↑ Importa backup</button><input id="tf-backup-file" type="file" accept="application/json,.json" hidden onchange="tfImportBackup(this)"></div><div id="tf-backup-status" class="tf-update-status"></div><small class="tf-backup-note">Il backup contiene anche gli utenti e le loro impostazioni. Conservalo in un luogo sicuro.</small></section></div>`};
window.tfForceUpdate=async function(){const status=document.getElementById('tf-update-status'),btn=document.getElementById('tf-force-update');if(btn)btn.disabled=true;if(status)status.textContent='Pulizia cache e aggiornamento in corso…';try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('tecnofa-')).map(k=>caches.delete(k)));}}catch(e){console.warn(e)}setTimeout(()=>{const u=new URL(location.href);u.searchParams.set('update',Date.now());location.replace(u.href)},250)};
window.tfExportBackup=function(){try{const data={app:'TECNOFA Gestionale',version:41,exportedAt:new Date().toISOString(),data:{}};for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key&&key.startsWith('tf_')&&!['tf_session','tf_password_resets'].includes(key))data.data[key]=localStorage.getItem(key)}const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');const d=new Date().toISOString().slice(0,10);a.href=url;a.download=`tecnofa-gestionale-backup-${d}.json`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);const s=document.getElementById('tf-backup-status');if(s)s.textContent='Backup esportato correttamente.'}catch(e){console.error(e);const s=document.getElementById('tf-backup-status');if(s)s.textContent='Errore durante l’esportazione del backup.'}};
window.tfImportBackup=function(input){const file=input?.files?.[0];if(!file)return;const s=document.getElementById('tf-backup-status');if(s)s.textContent='Lettura backup…';const reader=new FileReader();reader.onload=function(){try{const backup=JSON.parse(reader.result);if(!backup||backup.app!=='TECNOFA Gestionale'||!backup.data||typeof backup.data!=='object')throw new Error('Backup non valido');if(!confirm('Importando il backup i dati locali attuali del gestionale verranno sostituiti. Continuare?')){input.value='';if(s)s.textContent='Importazione annullata.';return}Object.keys(localStorage).filter(k=>k.startsWith('tf_')&&!['tf_session','tf_password_resets'].includes(k)).forEach(k=>localStorage.removeItem(k));Object.entries(backup.data).forEach(([key,value])=>{if(key.startsWith('tf_')&&!['tf_session','tf_password_resets'].includes(key))localStorage.setItem(key,String(value))});if(s)s.textContent='Backup importato. Ricaricamento…';setTimeout(()=>location.reload(),500)}catch(e){console.error(e);if(s)s.textContent='File non valido o backup danneggiato.';input.value=''}};reader.onerror=function(){if(s)s.textContent='Impossibile leggere il file.';input.value=''};reader.readAsText(file)};
if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=20261011-41',{scope:'./'}).catch(e=>console.warn('TECNOFA PWA SW:',e)))}
</script>
